<svg xmlns="http://www.w3.org/2000/svg" viewBox="-36 -42 72 84" width="48" height="48">
  <!-- Hexagon base -->
  <polygon points="0,-30 26,-15 26,15 0,30 -26,15 -26,-15" fill="none" stroke="currentColor" stroke-width="1.2"/>
  <!-- Gear teeth on vertices -->
  <line x1="0" y1="-30" x2="0" y2="-38" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="26" y1="-15" x2="32" y2="-19" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="26" y1="15" x2="32" y2="19" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="0" y1="30" x2="0" y2="38" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="-26" y1="15" x2="-32" y2="19" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="-26" y1="-15" x2="-32" y2="-19" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
  <!-- f(x) inside -->
  <text font-family="serif" font-size="16" font-style="italic" fill="currentColor" text-anchor="middle" dominant-baseline="central" y="1">f(x)</text>
</svg>
